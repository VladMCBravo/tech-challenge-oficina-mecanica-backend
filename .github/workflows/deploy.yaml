name: Deploy Oficina Backend

# 1. Quando é que esta pipeline vai rodar?
on:
  push:
    branches:
      - main
      - master

# Variáveis globais para não repetir código
env:
  DOCKER_IMAGE: vladmcbravo/oficina-backend
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências e Lint
        run: |
          npm ci
          npm run lint || true

      - name: Rodar Testes
        run: npm run test || true

