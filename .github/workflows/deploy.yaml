name: Deploy Oficina Backend

# 1. Quando é que esta pipeline vai rodar?
# R: Sempre que houver um "push" de código na branch "main" ou "master"
on:
  push:
    branches:
      - main
      - master

# Variáveis globais para não repetir código
env:
  DOCKER_IMAGE: vladmcbravo/oficina-backend # Pode mudar para o seu DockerHub ID real
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # O GitHub vai nos emprestar uma máquina Linux

    steps:
      # Passo 1: Fazer o download do seu código do GitHub para a máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Configurar o Node.js para rodar os testes
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Passo 3: Instalar as dependências e rodar o Linter
      - name: Instalar dependências e Lint
        run: |
          npm ci
          npm run lint || true

      # Passo 4: Rodar os Testes Automatizados (Exigência do Tech Challenge)
      - name: Rodar Testes
        run: npm run test
        # Opcional: Para gerar relatório de cobertura (coverage):
        # run: npm run test:cov

      # Passo 5: Fazer o Login no DockerHub (ou ECR) para guardar a imagem
      - name: Login no DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Passo 6: Fazer o Build da imagem (igualzinho ao que você fez localmente)
      # e empurrar (push) para o repositório público/privado
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Usa o SHA do commit para versionar a imagem (ex: oficina-backend:a1b2c3d)
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # Passo 7: Configurar credenciais da AWS para poder falar com o EKS
      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Passo 8: Atualizar o arquivo kubeconfig para falar com o Cluster EKS
      - name: Conectar ao EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name oficina-eks-cluster

      # Passo 9: O Grand Finale! Mandar o Kubernetes atualizar a imagem
      - name: Deploy no Kubernetes (EKS)
        run: |
          # Atualizamos o arquivo deployment.yaml na hora para usar a imagem nova
          sed -i "s|oficina-backend:local|${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g" k8s/deployment.yaml
          
          # Aplicamos as mudanças no cluster
          kubectl apply -f k8s/
          
          # Pedimos ao K8s para confirmar que a nova versão subiu com sucesso
          kubectl rollout status deployment/oficina-backend